[package]
name = "glint-desktop"
description = "Glint launcher desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "glint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glint-auth.workspace = true
glint-core.workspace = true
glint-gamedir.workspace = true
glint-horizon.workspace = true
glint-instance.workspace = true
glint-launch.workspace = true
glint-loader.workspace = true
glint-meta.workspace = true
glint-modrinth.workspace = true
glint-net.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tracing.workspace = true

[features]
# Release channels (see scripts/build.ps1). With neither feature it is the Public build.
# Dev: for developers, with experimental features and offline names without a Microsoft check.
dev = []
# Beta: the more or less stable build for invited testers; no experiments, offline names
# without a Microsoft check. Not for public downloads.
beta = []
