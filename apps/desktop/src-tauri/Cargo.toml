[package]
name = "glint-desktop"
description = "Glint launcher desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "glint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glint-auth.workspace = true
glint-core.workspace = true
glint-instance.workspace = true
glint-launch.workspace = true
glint-loader.workspace = true
glint-meta.workspace = true
glint-modrinth.workspace = true
glint-net.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tracing.workspace = true

[features]
# Personal build for testing with friends: offline names without a Microsoft check,
# like a dev build, but packed into one exe (see scripts/install-local.ps1).
local = []
