[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
glint-core = { path = "crates/glint-core" }
glint-net = { path = "crates/glint-net" }
glint-meta = { path = "crates/glint-meta" }
glint-java = { path = "crates/glint-java" }
glint-auth = { path = "crates/glint-auth" }
glint-launch = { path = "crates/glint-launch" }
glint-instance = { path = "crates/glint-instance" }
glint-gamedir = { path = "crates/glint-gamedir" }
glint-loader = { path = "crates/glint-loader" }
glint-modrinth = { path = "crates/glint-modrinth" }

fastnbt = "2"
flate2 = "1"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
wiremock = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
